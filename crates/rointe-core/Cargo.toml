[package]
name = "rointe-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust SDK for controlling Rointe WiFi radiators via Firebase Realtime Database"
keywords = ["rointe", "radiator", "firebase", "iot", "smart-home"]
categories = ["api-bindings", "hardware-support"]
repository = "https://github.com/crystollic/rointe-rs"
readme = "README.md"
rust-version = "1.75"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
